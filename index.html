<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Invitation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #4a5568;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.1em;
            color: #718096;
            margin-bottom: 30px;
        }
        .details {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: left;
        }
        .details p {
            margin: 10px 0;
            font-size: 1.05em;
        }
        .btn {
            display: inline-block;
            background: #48bb78;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background: #38a169;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Vous êtes invité ! 🎉</h1>
        <p class="subtitle">C'est un grand plaisir de vous convier à notre événement.</p>
        
        <div class="details">
            <p><strong>📅 Date :</strong> Samedi prochain à 18h00</p>
            <p><strong>📍 Lieu :</strong> 123 Avenue de la République</p>
            <p><strong>✨ Occasion :</strong> Fête d'essai / Célébration</p>
        </div>

        <p>Merci de bien vouloir confirmer votre présence en cliquant ci-dessous :</p>
        
        <!-- Remplace le lien '#' par le lien de ton Google Forms ou laisse-le pour l'essai -->
        <a href="#" class="btn">Je confirme ma présence</a>
    </div>

</body>
</html>
