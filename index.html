<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation de Tony</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f7f1e8;
            color: #333;
            text-align: center;
        }

        .invitation {
            max-width: 700px;
            margin: 40px auto;
            padding: 50px 25px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .nom {
            font-size: 32px;
            margin: 25px 0;
        }

        .details {
            font-size: 18px;
            line-height: 1.8;
            margin: 30px 0;
        }

        .bouton {
            display: inline-block;
            padding: 14px 25px;
            margin: 8px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

        .bouton:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="invitation">

    <p>✨ VOUS ÊTES NOTRE INVITÉ(E) SPÉCIAL(E) ✨</p>

    <h1>Invitation</h1>

    <div class="nom">
        Mr TONY
    </div>

    <p>
        Nous avons le plaisir de vous inviter à partager
        avec nous ce moment exceptionnel.
    </p>

    <div class="details">
        📅 Samedi 24 octobre 2026<br>
        🕒 15h00<br>
        📍 Lubumbashi
    </div>

    <a class="bouton" href="#">
        Confirmer ma présence
    </a>

    <a class="bouton" href="#">
        📍 Voir l'itinéraire
    </a>

</div>

</body>
</html>
